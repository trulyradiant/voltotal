<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}VolTotal{% endblock %}</title>
  <style>
    :root {
      --bleu: #1a4fd6; --bleu-fonce: #123a9e; --fond: #f4f6fb;
      --texte: #1c2333; --gris: #67718a; --vert: #0d7a4f; --rouge: #b3261e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: var(--fond); color: var(--texte); }
    header { background: linear-gradient(120deg, var(--bleu-fonce), var(--bleu));
             color: #fff; padding: 1.4rem 1rem; }
    header .contenu, main { max-width: 60rem; margin: 0 auto; padding: 0 1rem; }
    header h1 { margin: 0; font-size: 1.5rem; }
    header h1 a { color: inherit; text-decoration: none; }
    header p { margin: .3rem 0 0; opacity: .9; font-size: .95rem; }
    main { padding: 1.5rem 1rem 3rem; }
    .carte { background: #fff; border-radius: 12px; padding: 1.2rem 1.4rem;
             box-shadow: 0 1px 4px rgba(20, 30, 60, .08); margin-bottom: 1rem; }
    label { display: block; font-size: .85rem; color: var(--gris); margin-bottom: .25rem; }
    input[type=text], input[type=date], input[type=number] {
      width: 100%; padding: .55rem .7rem; border: 1px solid #cdd4e4;
      border-radius: 8px; font-size: 1rem; }
    .bouton { background: var(--bleu); color: #fff; border: 0; border-radius: 8px;
              padding: .7rem 1.6rem; font-size: 1.05rem; cursor: pointer; }
    .bouton:hover { background: var(--bleu-fonce); }
    .erreur { background: #fdecea; color: var(--rouge); border-radius: 8px;
              padding: .8rem 1rem; margin-bottom: 1rem; }
    .note { color: var(--gris); font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <div class="contenu">
      <h1><a href="{{ url_for('accueil') }}">✈️ VolTotal</a></h1>
      <p>Le prix <strong>réel</strong> de votre vol — bagages, siège et frais inclus, calculés à l'avance.</p>
    </div>
  </header>
  <main>{% block contenu %}{% endblock %}</main>
</body>
</html>
